          <path d="M 50 42 Q 62 38 70 32" fill="none" stroke="#2f9e44" stroke-width="3" stroke-linecap="round"/>
          <path d="M 50 52 Q 40 50 34 44" fill="none" stroke="#2f9e44" stroke-width="3" stroke-linecap="round"/>

        <button id="btn-budget" class="nbtn" onclick="setSection('budget')"><span class="nico">📋</span><span class="nvlabel">Presupuesto</span></button>
        <button id="btn-prices" class="nbtn" onclick="setSection('prices')"><span class="nico">💰</span><span class="nvlabel">Base de Precios</span></button>
      </div>

      <div class="nav-group">
        <div class="nav-label">Gestión de Proyecto</div>

        <button id="btn-contractors" class="nbtn" onclick="setSection('contractors')"><span class="nico">👷</span><span class="nvlabel">Personal y Contratistas</span></button>

      </div>

      <div class="nav-group">

    <div id="section-projects" class="view" style="display:none"></div>
    <div id="section-schedule" class="view" style="display:none"></div>
    <div id="section-logs" class="view" style="display:none"></div>
    <div id="section-contratos" class="view" style="display:none"></div>
    <div id="section-finances" class="view" style="display:none"></div>
    <div id="section-performance" class="view" style="display:none"></div>
    <div id="section-dashboard" class="view" style="display:none"></div>
    <div id="section-prices" class="view" style="display:none"></div>
    <div id="section-themes" class="view" style="display:none"></div> 
    <div id="section-documents" class="view" style="display:none"></div>
    <div id="section-folder" class="view" style="display:none"></div>
    <div id="section-suppliers" class="view" style="display:none"></div>
    <div id="section-resources" class="view" style="display:none"></div>

<!-- PWA: Service Worker -->
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(reg => {
      // Detectar nueva versión disponible
      reg.addEventListener('updatefound', () => {
        const newSW = reg.installing;
        newSW?.addEventListener('statechange', () => {
          if (newSW.state === 'installed' && navigator.serviceWorker.controller) {
            // Hay nueva versión esperando — mostrar toast no intrusivo
            if (typeof toast === 'function') {
              toast('Nueva versión disponible. Recargá la app para actualizar.');
            }
          }
        });
      });
    }).catch(err => console.warn('[SW] Registro falló:', err));
  });
}
</script>
